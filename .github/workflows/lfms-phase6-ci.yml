name: LFMS Phase 6 CI

on:
  pull_request:
    branches:
      - feat/lfms-core-api-architecture
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/lfms-phase6-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Laravel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, xml, curl
          coverage: none
      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --working-dir=backend
      - name: Run Laravel tests
        working-directory: backend
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: php artisan test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Lint frontend
        run: npm run lint --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
