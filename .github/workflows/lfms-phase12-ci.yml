name: LFMS Phase 12 CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/lfms-phase12-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Laravel feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, xml, curl, fileinfo
          coverage: none
      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --working-dir=backend
      - name: Run Laravel feature tests
        working-directory: backend
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: vendor/bin/phpunit

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run ESLint
        run: npm run lint --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  postgres-reservation:
    name: PostgreSQL reservation concurrency tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lfms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lfms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql, pgsql, pcntl, xml, curl
          coverage: none
      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --working-dir=backend
      - name: Run isolated PostgreSQL reservation tests
        working-directory: backend
        run: vendor/bin/phpunit -c phpunit.pgsql.xml
